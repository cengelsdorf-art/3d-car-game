<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Car Rush</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
    }

    #ui {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
    }

    #message {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 42px;
        font-weight: bold;
        text-shadow: 3px 3px 6px #000;
        pointer-events: none;
        z-index: 20;
    }

    #controls {
        position: fixed;
        bottom: 20px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 30px;
        z-index: 30;
    }

    button {
        width: 90px;
        height: 65px;
        border: none;
        border-radius: 18px;
        font-size: 30px;
        background: rgba(255,255,255,0.85);
    }
</style>
</head>

<body>

<div id="ui">
    🏁 Level: <span id="level">1</span>
    &nbsp;&nbsp;
    ❤️ <span id="lives">3</span>
</div>

<div id="message"></div>

<div id="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =========================
// GRUNDLAGEN
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb, 40, 180);


const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

camera.position.set(0, 6, 12);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// =========================
// LICHT
// =========================

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2
);

sunlight.position.set(10, 20, 10);

sunlight.castShadow = true;

scene.add(sunlight);


const ambient = new THREE.AmbientLight(
    0xffffff,
    0.6
);

scene.add(ambient);


// =========================
// BODEN
// =========================

const groundGeometry =
    new THREE.PlaneGeometry(200, 500);

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4c9a45
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x = -Math.PI / 2;

ground.position.z = -150;

ground.receiveShadow = true;

scene.add(ground);


// =========================
// STRASSE
// =========================

const roadGeometry =
    new THREE.PlaneGeometry(14, 500);

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x333333
    });

const road =
    new THREE.Mesh(
        roadGeometry,
        roadMaterial
    );

road.rotation.x = -Math.PI / 2;

road.position.y = 0.02;

road.position.z = -150;

scene.add(road);


// =========================
// STRASSENMARKIERUNGEN
// =========================

const lines = [];

for (let i = 0; i < 40; i++) {

    const geometry =
        new THREE.BoxGeometry(0.3, 0.05, 5);

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffffff
        });

    const line =
        new THREE.Mesh(
            geometry,
            material
        );

    line.position.set(
        0,
        0.08,
        -i * 12
    );

    scene.add(line);

    lines.push(line);
}


// =========================
// AUTO
// =========================

const car = new THREE.Group();


// Karosserie

const bodyGeometry =
    new THREE.BoxGeometry(2.2, 0.7, 4);

const bodyMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xe21b23
    });

const body =
    new THREE.Mesh(
        bodyGeometry,
        bodyMaterial
    );

body.position.y = 0.7;

body.castShadow = true;

car.add(body);


// Dach

const roofGeometry =
    new THREE.BoxGeometry(1.5, 0.65, 1.8);

const roofMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x9ed8ff
    });

const roof =
    new THREE.Mesh(
        roofGeometry,
        roofMaterial
    );

roof.position.set(
    0,
    1.3,
    -0.2
);

roof.castShadow = true;

car.add(roof);


// Räder

const wheelGeometry =
    new THREE.CylinderGeometry(
        0.42,
        0.42,
        0.35,
        20
    );

const wheelMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111111
    });

const wheelPositions = [
    [-1.15, 0.45, 1.3],
    [1.15, 0.45, 1.3],
    [-1.15, 0.45, -1.3],
    [1.15, 0.45, -1.3]
];

wheelPositions.forEach(position => {

    const wheel =
        new THREE.Mesh(
            wheelGeometry,
            wheelMaterial
        );

    wheel.rotation.z =
        Math.PI / 2;

    wheel.position.set(
        position[0],
        position[1],
        position[2]
    );

    wheel.castShadow = true;

    car.add(wheel);
});


car.position.set(
    0,
    0,
    8
);

scene.add(car);


// =========================
// HINDERNISSE
// =========================

const obstacles = [];

function createObstacle(z) {

    const geometry =
        new THREE.BoxGeometry(
            2,
            1.5,
            2
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xff8c00
        });

    const obstacle =
        new THREE.Mesh(
            geometry,
            material
        );

    obstacle.position.set(
        THREE.MathUtils.randFloat(-5, 5),
        0.75,
        z
    );

    obstacle.castShadow = true;

    scene.add(obstacle);

    obstacles.push(obstacle);
}


// =========================
// LEVEL
// =========================

let level = 1;

let lives = 3;

let speed = 0.45;

function createLevel() {

    obstacles.forEach(
        obstacle => scene.remove(obstacle)
    );

    obstacles.length = 0;

    const amount = 5 + level * 2;

    for (let i = 0; i < amount; i++) {

        createObstacle(
            -40 - i * 25
        );
    }

    speed =
        0.45 + level * 0.08;
}


// =========================
// STEUERUNG
// =========================

let targetX = 0;

function moveLeft() {

    targetX -= 1.2;

    targetX =
        Math.max(-5, targetX);
}

function moveRight() {

    targetX += 1.2;

    targetX =
        Math.min(5, targetX);
}


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "ArrowLeft")
            moveLeft();

        if (event.key === "ArrowRight")
            moveRight();
    }
);


document.getElementById("left")
    .addEventListener(
        "pointerdown",
        moveLeft
    );

document.getElementById("right")
    .addEventListener(
        "pointerdown",
        moveRight
    );


// =========================
// KOLLISION
// =========================

function checkCollision(a, b) {

    const boxA =
        new THREE.Box3()
            .setFromObject(a);

    const boxB =
        new THREE.Box3()
            .setFromObject(b);

    return boxA.intersectsBox(boxB);
}


// =========================
// SPIEL
// =========================

const levelText =
    document.getElementById("level");

const livesText =
    document.getElementById("lives");

const message =
    document.getElementById("message");


let distance = 0;

let gameRunning = true;


function nextLevel() {

    level++;

    levelText.textContent =
        level;

    message.textContent =
        "LEVEL " + level + " 🔥";

    gameRunning = false;

    setTimeout(() => {

        message.textContent = "";

        distance = 0;

        createLevel();

        gameRunning = true;

    }, 1200);
}


function gameOver() {

    gameRunning = false;

    message.textContent =
        "GAME OVER 💥";

    setTimeout(() => {

        level = 1;

        lives = 3;

        livesText.textContent =
            lives;

        levelText.textContent =
            level;

        message.textContent = "";

        distance = 0;

        createLevel();

        gameRunning = true;

    }, 2000);
}


// =========================
// ANIMATION
// =========================

function animate() {

    requestAnimationFrame(
        animate
    );


    if (gameRunning) {

        // Auto bewegen

        car.position.x +=
            (targetX - car.position.x) * 0.12;


        // Straße bewegen

        lines.forEach(line => {

            line.position.z += speed;

            if (line.position.z > 20) {

                line.position.z -= 480;
            }
        });


        // Hindernisse

        obstacles.forEach(obstacle => {

            obstacle.position.z += speed;

            if (obstacle.position.z > 20) {

                obstacle.position.z -=
                    150 + Math.random() * 100;

                obstacle.position.x =
                    THREE.MathUtils.randFloat(
                        -5,
                        5
                    );
            }


            if (
                checkCollision(
                    car,
                    obstacle
                )
            ) {

                obstacle.position.z =
                    -200;

                lives--;

                livesText.textContent =
                    lives;

                if (lives <= 0) {

                    gameOver();
                }
            }
        });


        distance += speed;

        if (distance > 500) {

            nextLevel();
        }
    }


    // Kamera

    camera.position.x +=
        (car.position.x -
        camera.position.x) * 0.05;

    camera.lookAt(
        car.position.x,
        0,
        -20
    );


    renderer.render(
        scene,
        camera
    );
}


// =========================
// START
// =========================

createLevel();

animate();


// =========================
// FENSTERGRÖSSE
// =========================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
